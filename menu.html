<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menu Details | ChefNearby</title><meta name="description" content="Explore ChefNearby menus and request a custom chef-at-home menu."><meta name="robots" content="index,follow"><link rel="canonical" href="https://chefnearby.in/menu.html"><style>:root{--bg:#f5f7f2;--ink:#142b24;--muted:#64756d;--brand:#176b52;--line:#dce6df}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Inter,system-ui,Arial,sans-serif}a{color:var(--brand)}.wrap{max-width:1050px;margin:auto;padding:0 22px}.nav{border-bottom:1px solid var(--line)}.navin{height:68px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:23px;font-weight:900;text-decoration:none;color:var(--ink)}.logo span{color:var(--brand)}.hero{padding:48px 0;background:linear-gradient(135deg,#f5f7f2,#e4eee7)}h1{font-size:clamp(34px,5vw,58px);line-height:1.08}.muted{color:var(--muted)}.btn{display:inline-block;background:var(--brand);color:white;padding:12px 18px;border-radius:12px;text-decoration:none;font-weight:800}.section{padding:32px 0}.panel,.card{background:white;border:1px solid var(--line);border-radius:18px;padding:20px;margin:12px 0}.footer{background:#10251e;color:white;padding:25px 0;margin-top:25px}.footer a{color:#d9e9df}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><nav class="nav"><div class="wrap navin"><a class="logo" href="./index.html">Chef<span>Nearby</span></a><a href="./index.html#menu">All cuisines</a></div></nav><header class="hero"><div class="wrap"><p>CHEFNEARBY MENU GUIDE</p><h1 id="title">Loading menu…</h1><p id="intro" class="muted">Loading menu items.</p><a class="btn" href="./index.html#book">Request this menu →</a></div></header><main class="wrap section"><div id="items" class="grid"></div><div id="status" class="panel">Loading…</div></main><footer class="footer"><div class="wrap">ChefNearby · <a href="./terms.html">Terms</a> · <a href="./privacy.html">Privacy</a></div></footer><script src="./config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async function(){const $=id=>document.getElementById(id),p=new URLSearchParams(location.search),id=p.get('id'),cfg=window.CHEFNEARME||{};if(!window.supabase||!cfg.supabaseUrl){$('status').textContent='Catalogue unavailable.';return}const db=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);const [m,d,l]=await Promise.all(['menus','dishes','menu_dishes'].map(t=>db.from(t).select('*').limit(1000)));if(m.error||d.error||l.error){$('status').textContent='Menu data is temporarily unavailable.';return}const val=(r,ks)=>{for(const k of ks)if(r&&r[k]!=null&&String(r[k]).trim()!=='')return r[k];return ''},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const menu=(m.data||[]).find(x=>String(x.id)===String(id));if(!menu){$('title').textContent='Menu not found';$('status').textContent='Select a menu from the cuisine catalogue.';return}$('title').textContent=val(menu,['name','title','slug'])||'ChefNearby Menu';document.title=$('title').textContent+' | ChefNearby';$('intro').textContent=val(menu,['description','summary'])||'Menu details from the ChefNearby catalogue.';const ids=new Set((l.data||[]).filter(x=>String(val(x,['menu_id']))===String(menu.id)).map(x=>String(val(x,['dish_id']))));const dishes=(d.data||[]).filter(x=>ids.has(String(x.id)));$('items').innerHTML=dishes.map(x=>'<a class="card" href="./dish.html?id='+encodeURIComponent(x.id)+'&slug='+encodeURIComponent(val(x,['slug']))+'"><h3>'+esc(val(x,['name','dish_name','title','slug']))+'</h3><p>'+esc(val(x,['description','short_description'])||'Dish details')+'</p><b>View dish →</b></a>').join('');$('status').textContent=dishes.length+' linked menu items.'})();</script></body></html>
