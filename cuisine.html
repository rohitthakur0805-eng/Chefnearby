const slug=s=>String(s||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
async function read(db,t){const {data,error}=await db.from(t).select('*').limit(1000);if(error){console.warn(t,error.message);return {rows:[],error:error.message}}return {rows:data||[],error:null}}
function card(name,desc,icon){return '<article class="card"><div class="icon">'+icon+'</div><h3>'+esc(name)+'</h3><p>'+esc(desc||'Details will be added soon.')+'</p></article>'}
async function init(){
 if(!window.supabase||!cfg.supabaseUrl||!cfg.supabasePublishableKey){$('status').textContent='Catalogue connection is not configured.';return}
 const db=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);
 const [cr,dr,mr,mdr]=await Promise.all(['cuisines','dishes','menus','menu_dishes'].map(t=>read(db,t)));
 const cuisines=cr.rows.filter(active), dishes=dr.rows.filter(active), menus=mr.rows.filter(active), links=mdr.rows;
 const cuisine=cuisines.find(c=>String(c.id||'')===wantedId)||cuisines.find(c=>slug(val(c,['slug'])||label(c))===wantedSlug)||cuisines.find(c=>slug(label(c))===wantedSlug);
 const canon=document.querySelector('link[rel=canonical]');if(canon)canon.href='https://chefnearby.in/cuisine.html?slug='+encodeURIComponent(val(cuisine||{},['slug'])||wantedSlug);if(!cuisine){$('title').textContent='Cuisine not found';$('intro').textContent='This cuisine could not be matched to a live database record.';$('status').textContent='Check the cuisine slug and the Supabase cuisines table.';return}

 $('intro').textContent='Explore '+label(cuisine)+' dishes and available menus. Select a menu or request a chef for your occasion.';
 $('bookLink').href='./index.html?cuisine='+encodeURIComponent(val(cuisine,['slug'])||slug(label(cuisine)))+'#book';

 const cuisineDishes=dishes.filter(d=>{
   const id=val(d,['cuisine_id','cuisineId','cuisine_uuid']);
   if(id!=='')return String(id)===String(cuisine.id);
   const name=val(d,['cuisine_slug','cuisine_name','cuisine']);
   if(name!=='')return [label(cuisine),val(cuisine,['slug'])].some(x=>String(x||'').toLowerCase()===String(name).toLowerCase());
   return linkedDishIds.has(String(d.id));
